# Configuration de mkdocs pour la génération de pages.
site_name: CyberNotes
site_url: https://Varonex.github.io/cyber-notes/
site_description: Cybersecurity-related notes I made over time.
site_author: Varonex

repo_name: Varonex/cyber-notes
repo_url: https://github.com/Varonex/cyber-notes

theme:
    name: material
    language: en

  # Couleurs.
    palette:
        # Thème clair.
        - media: "(prefer-color-scheme: light)"
          scheme: default
          primary: red
          accent: red
          toggle:
            icon: material/brightness-7
            name: Switch to dark theme

        - media: "(prefer-color-scheme: dark)"
          scheme: slate
          primary: red
          accent: red
          toggle:
            icon: material/brightness-4
            name: Switch to light theme

  # Contenu du site.
    features:
        # Navigation avancée.
        - navigation.indexes
        - navigation.top
        - navigation.tracking
        - navigation.footer

        # Amélioration sommaire.
        - toc.integrate
        - toc.follow

        # Blocs de code.
        - content.code.copy
        - content.code.select
        - content.code.annotate

        # Barre de recherche.
        - search.suggest
        - search.highlight
        - search.share

# Markdown additionnel.
markdown_extensions:
    # Inclusions.
    - pymdownx.snippets:
        base_path:
            - docs

    # Interprétations et parsing.
    - admonition
    - pymdownx.details
    - pymdownx.magiclink

    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true

    - pymdownx.inlinehilite

    - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format

    - pymdownx.tabbed:
        alternate_style: true

    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

    # Params modules features.
    - toc:
        permalink: true
        toc_depth: 3


# Liaison CSS.
extra_css:
    - css/style.css

# Liaison JS.
extra_javascript:
    - js/app.js

# Copyright
copyright: "CyberNotes &copy; 2026 by Varonex is licensed under CC BY-NC-SA 4.0. To view a copy of this license, visit https://creativecommons.org/licenses/by-nc-sa/4.0/"

# Extra
extra:
    # Enlève les marques du générateur.
    generator: false

    # Réseaux
    scoial:
        - icon: fontawesome/brands/github
          link: https://varonex.github.io
          name: Varonex's Pages

# Navigation aisée.
nav:
    - CyberNotes:
        - index.md
        - CLI:
            - Bash:
                - Awk: notes/cli/bash/awk.md
                - Basics: notes/cli/bash/basics.md
                - Networking: notes/cli/bash/networking.md
                - Scripting: notes/cli/bash/scripting.md

        - Pentest:
            - Web:
                - Client:
                    - "Cross Site Scripting (XSS)": notes/pentest/web/client/xss.md
                - Server:
                    - "Path Traversal": notes/pentest/web/server/path-traversal.md
                    - "SQL Injections (SQLi)": notes/pentest/web/server/sqli.md

        - Tools:
            - "Credentials & Cracking":
                - Hashcat: notes/tools/credentials-and-cracking/hashcat.md
                - "John The Ripper": notes/tools/credentials-and-cracking/john.md
            - "Post-Exploitation & AD":
                - Impacket: notes/tools/postexploitation-and-ad/impacket.md
                - Metasploit: notes/tools/postexploitation-and-ad/metasploit.md
            - "Recon & Footprinting":
                - Amass: notes/tools/recon-and-footprinting/amass.md
                - Masscan: notes/tools/recon-and-footprinting/masscan.md
                - NMap: notes/tools/recon-and-footprinting/nmap.md
                - Subfinder: notes/tools/recon-and-footprinting/subfinder.md
            - "Traffic & Analysis":
                - Wireshark: notes/tools/traffic-and-analysis/wireshark.md
            - "Vulnerability Scanning":
                - FFUF: notes/tools/vulnerability-scanning/ffuf.md
                - GoBuster: notes/tools/vulnerability-scanning/gobuster.md
                - Nuclei: notes/tools/vulnerability-scanning/nuclei.md
            - "Web Assessment":
                - "Burp Suite": notes/tools/web-assessment/burpsuite.md
                - SQLMap: notes/tools/web-assessment/sqlmap.md
            - "Wireless Security":
                - "Aircrack-ng": notes/tools/wireless-security/aircrack-ng.md

        - "Useful websites": notes/online-tools/useful-websites.md

        - Writeups:
            - "Over The Wire":
                - Bandit: notes/writeups/over-the-wire/bandit.md
