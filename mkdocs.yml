# Configuration de mkdocs pour la génération de pages.
site_name: CyberNotes
site_url: https://Varonex.github.io/cyber-notes/
site_description: Cybersecurity-related notes I made over time.
site_author: Varonex

repo_name: Varonex/cyber-notes
repo_url: https://github.com/Varonex/cyber-notes

theme:
    name: material
    language: en

  # Couleurs.
    palette:
        # Thème clair.
        - media: "(prefer-color-scheme: light)"
          scheme: default
          primary: red
          accent: red
          toggle:
            icon: material/brightness-7
            name: Switch to dark theme

        - media: "(prefer-color-scheme: dark)"
          scheme: slate
          primary: red
          accent: red
          toggle:
            icon: material/brightness-4
            name: Switch to light theme

  # Contenu du site.
    features:
        # Navigation avancée.
        - navigation.indexes
        - navigation.top
        - navigation.tracking
        - navigation.footer

        # Amélioration sommaire.
        - toc.integrate
        - toc.follow

        # Blocs de code.
        - content.code.copy
        - content.code.select
        - content.code.annotate

        # Barre de recherche.
        - search.suggest
        - search.highlight
        - search.share

# Plugins.
#plugins:
#    - search
#    - git-revision-date-localized:
#        enable_creation_date: true
#        type: timeago
#        fallback_to_build_date: true

# Markdown additionnel.
markdown_extensions:
    # Inclusions.
    - pymdownx.snippets:
        base_path:
            - docs

    # Interprétations et parsing.
    - admonition
    - pymdownx.details
    - pymdownx.magiclink

    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true

    - pymdownx.inlinehilite

    - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format

    - pymdownx.tabbed:
        alternate_style: true

    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

    # Params modules features.
    - toc:
        permalink: true
        toc_depth: 3


# Liaison CSS.
extra_css:
    - css/style.css

# Liaison JS.
extra_javascript:
    - js/app.js

# Copyright
copyright: "CyberNotes &copy; 2026 by Varonex is licensed under CC BY-NC-SA 4.0. To view a copy of this license, visit <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CreativeCommons</a>"

# Extra
extra:
    # Enlève les marques du générateur.
    generator: false

    # Réseaux
    social:
        - icon: material/hub
          link: https://varonex.github.io
          name: Varonex's Pages
        - icon: fontawesome/brands/github
          link: https://github.com/Varonex
          name: Github

