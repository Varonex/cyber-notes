# Configuration de mkdocs pour la génération de pages.
site_name: CyberNotes
site_url: https://Varonex.github.io/cyber-notes/
site_description: Cybersecurity-related notes I made over time.
site_author: Varonex

repo_name: Varonex/cyber-notes
repo_url: https://github.com/Varonex/cyber-notes

theme:
    name: material
    language: en
    copyright: "CyberNotes &copy; 2026 by Varonex is licensed under CC BY-NC-SA 4.0. To view a copy of this license, visit https://creativecommons.org/licenses/by-nc-sa/4.0/"

  # Couleurs.
    palette:
        # Thème clair.
        - media: "(prefer-color-scheme: light)"
          scheme: default
          primary: red
          accent: red
          toggle:
            icon: material/brightness-7
            name: Switch to dark theme

        - media: "(prefer-color-scheme: dark)"
          scheme: slate
          primary: red
          accent: red
          toggle:
            icon: material/brightness-4
            name: Switch to light theme

  # Contenu du site.
    features:
        # Navigation avancée.
        - navigation.indexes
        - navigation.sections
        - navigation.top
        - navigation.tracking

        # Amélioration sommaire.
        - toc.integrate
        - toc.follow

        # Blocs de code.
        - content.code.copy
        - content.code.select
        - content.code.annotate

        # Barre de recherche.
        - search.suggest
        - search.highlight
        - search.share

# Markdown additionnel.
markdown_extensions:
    # Inclusions.
    - pymdownx.snippets:
        base_path:
            - docs

    # Interprétations et parsing.
    - admonition
    - pymdownx.details

    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true

    - pymdownx.inlinehilite

    - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format

    - pymdownx.tabbed:
        alternate_style: true

    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

    # Params modules features.
    - toc:
        permalink: true
        toc_depth: 3


# Liaison CSS.
extra_css:
    - css/style.css

# Liaison JS.
extra_javascript:
    - js/app.js

# Enlève les marques du générateur.
extra:
    generator: false

# Navigation aisée.
nav:
    - CyberNotes:
        - introduction.md

        - CLI:
            - Bash:
                - AWK: cybernotes/cli/bash/awk.md
                - Basics: cybernotes/cli/bash/basics.md
                - Networking: cybernotes/cli/bash/networking.md
                - Scripting: cybernotes/cli/bash/scripting.md+

        - Pentest:
            - Web:
                - Client:
                    - "Cross Site Scripting (XSS)": cybernotes/pentest/web/client/xss.md
                - Server:
                    - "Path Traversal": cybernotes/pentest/web/server/path-traversal.md
                    - "SQL Injections (SQLi)": cybernotes/pentest/web/server/sqli.md

        - Tools:
            - "Credentials & Cracking":
                - Hashcat: cybernotes/tools/credentials_and_cracking/hashcat.md
                - "John The Ripper": cybernotes/tools/credentials_and_cracking/john.md
            - "Post-Exploitation & AD":
                - Impacket: cybernotes/tools/postexploitation_and_ad/impacket.md
                - Metasploit: cybernotes/tools/postexploitation_and_ad/metasploit.md
            - "Recon & Footprinting":
                - Amass: cybernotes/tools/recon_and_footprinting/amass.md
                - Masscan: cybernotes/tools/recon_and_footprinting/masscan.md
                - NMap: cybernotes/tools/recon_and_footprinting/nmap.md
                - Subfinder: cybernotes/tools/recon_and_footprinting/subfinder.md
            - "Traffic & Analysis":
                - Wireshark: cybernotes/tools/traffic_and_analysis/wireshark.md
            - "Vulnerability Scanning":
                - FFUF: cybernotes/tools/vulnerability_scanning/ffuf.md
                - GoBuster: cybernotes/tools/vulnerability_scanning/gobuster.md
                - Nuclei: cybernotes/tools/vulnerability_scanning/nuclei.md
            - "Web Assessment":
                - "Burp Suite": cybernotes/tools/web_assessment/burpsuite.md
                - SQLMap: cybernotes/tools/web_assessment/sqlmap.md
            - "Wireless Security":
                - "Aircrack-ng": cybernotes/tools/wireless_security/aircrack-ng.md

        - "Useful websites": cybernotes/online_tools/useful-websites.md

        - Writeups:
            - "Over The Wire":
                - Bandit: cybernotes/writeups/over_the_wire/bandit.md
